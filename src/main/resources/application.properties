spring.application.name=jwt-auth-product-api
server.port=8080

# ---- PostgreSQL (products) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
# Base64 encoded key, at least 32 bytes. OVERRIDE IN PRODUCTION via JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:B4bxPGHoA2jKXylZEeV6JG/8i85AnEuixPvSI8IHYKU/acp+GskwfajM6/LuFC93}
app.jwt.expiration-minutes=60

# ---- OTP ----
app.otp.expiry-minutes=5
# DEMO ONLY: returns OTP in the sign-up response (there is no email/SMS provider). Set false in production.
app.otp.expose-in-response=true

# ---- Country restriction (ISO 3166-1 alpha-2 codes) ----
app.geo.enabled=true
app.geo.blocked-countries=SY,AF,IR,KP
# If the geo-IP provider is unreachable: true = allow sign-up, false = reject with 503
app.geo.fail-open=false
app.geo.provider-url=http://ip-api.com/json/

# ---- Seed admin (in-memory, so we can test Settings access immediately) ----
app.seed.admin.username=admin_user
app.seed.admin.email=admin_user@example.com
app.seed.admin.password=Admin@123

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
